[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "adsink"
version = "0.1.0"
requires-python = ">=3.14"

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
adsink = "adsink.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
